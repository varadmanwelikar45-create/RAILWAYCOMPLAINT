{% extends 'base.html' %}

{% block title %}Passenger Registration — RailCare{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <h2>Passenger Registration</h2>
    <p>Create your RailCare account to lodge and track complaints.</p>
  </div>

  <form id="registration-form" method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-group">
      <label class="form-label" for="full_name">Full Name <span class="required">*</span></label>
      <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Rahul Sharma" value="{{ full_name or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address <span class="required">*</span></label>
      <input type="email" id="email" name="email" class="form-control" placeholder="passenger@example.com" value="{{ email or '' }}" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="mobile">Mobile Number <span class="required">*</span></label>
      <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" value="{{ mobile or '' }}" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password <span class="required">*</span></label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password <span class="required">*</span></label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
      Create Account
    </button>
  </form>

  <div class="auth-footer">
    <p>Already have a RailCare account? <a href="{{ url_for('auth.login') }}">Log in here</a></p>
  </div>
</div>
{% endblock %}
