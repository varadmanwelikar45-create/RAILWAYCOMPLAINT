{% extends 'base.html' %}

{% block title %}Passenger Login — RailCare{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-header">
    <h2>Passenger Login</h2>
    <p>Sign in to view your complaints and track resolution progress.</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label class="form-label" for="email">Email Address <span class="required">*</span></label>
      <input type="email" id="email" name="email" class="form-control" placeholder="passenger@example.com" value="{{ email or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password <span class="required">*</span></label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
      Log In
    </button>
  </form>

  <div class="auth-footer">
    <p>Don't have an account yet? <a href="{{ url_for('auth.register') }}">Register now</a></p>
    <p style="margin-top: 0.5rem;"><a href="{{ url_for('auth.admin_login') }}" style="color: var(--color-primary); font-size: 0.8rem;">Are you a Railway Administrator? Sign in here &rarr;</a></p>
  </div>
</div>
{% endblock %}
