            Report a railway issue and get help at your coach. Book verified station specialists, track assistance live on platform, and resolve grievances fast.
          </p>
        </header>

        <main>
          <section style="background: #FFFFFF; border: 1px solid #DDE4E6; border-radius: 16px; padding: 24px; margin-bottom: 20px;">
            <h2 style="font-size: 18px; margin-top: 0; color: #202A2B;">Passenger Services &amp; Direct Coach Assistance</h2>
            <ul style="padding-left: 20px; font-size: 14px; color: #526365;">
              <li><strong>Railway Grievance Lodging:</strong> File coach complaints regarding cleanliness, AC cooling, electrical sockets, or plumbing with instantaneous complaint ID tracking.</li>
              <li><strong>Verified Gig Specialist Booking:</strong> Discover and schedule on-duty technicians at upcoming junction stops (AC technicians, plumbers, coach cleaners, luggage porters).</li>
              <li><strong>Live Platform &amp; Coach Radar:</strong> Coordinate directly with assigned personnel using platform door and berth location indicators.</li>
            </ul>
          </section>

          <section style="background: #FFFFFF; border: 1px solid #DDE4E6; border-radius: 16px; padding: 24px; margin-bottom: 20px;">
            <h2 style="font-size: 18px; margin-top: 0; color: #202A2B;">Supported Major Railway Stations</h2>
            <p style="font-size: 14px; color: #526365; margin-bottom: 12px;">Active workforce hubs operating at high-density passenger junctions:</p>

              <div style="background: #F8FAFB; border: 1px solid #DDE4E6; padding: 12px; border-radius: 8px;"><strong>Howrah (HWH)</strong><br><span style="color: #7E9092;">Eastern Railway</span></div>
              <div style="background: #F8FAFB; border: 1px solid #DDE4E6; padding: 12px; border-radius: 8px;"><strong>Chennai Central (MAS)</strong><br><span style="color: #7E9092;">Southern Railway</span></div>
              <div style="background: #F8FAFB; border: 1px solid #DDE4E6; padding: 12px; border-radius: 8px;"><strong>Bengaluru City (SBC)</strong><br><span style="color: #7E9092;">South Western Railway</span></div>
              <div style="background: #F8FAFB; border: 1px solid #DDE4E6; padding: 12px; border-radius: 8px;"><strong>Pune Junction (PUNE)</strong><br><span style="color: #7E9092;">Central Railway</span></div>
            </div>
